name: Build Docker image
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check
        run: nix flake check -L

      # The other tests already ran in the Nix sandbox. These talk to third parties,
      # which behave the same regardless of architecture.
      - name: Run tests against live registries
        if: matrix.arch == 'amd64'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix shell --inputs-from . nixpkgs#cargo nixpkgs#rustc \
            --command cargo test --locked -- --ignored

      - name: Build image
        run: nix build -L .#dockerImage

      - name: Prepare image artifact
        run: cp --dereference result image.tar

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish image
    # Fork and Dependabot runs have read-only tokens. Their artifacts remain downloadable.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write # Push the multi-architecture image to GHCR.
    steps:
      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*

      - name: Push multi-arch image
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            tag="pr-$PR_NUMBER"
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            tag=latest
          else
            branch=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9_.-' '-' | cut -c1-100)
            tag="branch-$branch"
          fi

          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io --username "$REGISTRY_USER" --password-stdin
          podman manifest create lighthouse
          podman manifest add lighthouse docker-archive:image-amd64/image.tar
          podman manifest add lighthouse docker-archive:image-arm64/image.tar
          # Architecture images are pushed untagged; only the list carries tags.
          podman manifest push --all lighthouse "docker://$image:sha-$GITHUB_SHA"
          podman manifest push --all lighthouse "docker://$image:$tag"
