[package]
name = "lighthouse"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Watches for docker base image updates"
license = "MIT"

[dependencies]
bollard = "0.21"
clap = { version = "4", features = ["derive", "env"] }
croner = { version = "4", default-features = false, features = ["jiff"] }
docker_credential = "1.4"
futures-util = "0.3"
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
octocrab = { version = "0.54.2", default-features = false, features = ["reqwest", "jwt-rust-crypto"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls-no-provider", "stream"] }
rootcause = "0.13"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = "symbols"
